<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">

  <defs>
    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="-1.5" result="up"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="darkFlood"/>
      <feComposite in="darkFlood" in2="up" operator="in" result="dark"/>
      <feOffset in="SourceAlpha" dx="0" dy="1.5" result="dn"/>
      <feFlood flood-color="#fff" flood-opacity="0.85" result="lightFlood"/>
      <feComposite in="lightFlood" in2="dn" operator="in" result="light"/>
      <feOffset in="SourceAlpha" dx="-1" dy="0" result="left"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="d2"/>
      <feComposite in="d2" in2="left" operator="in" result="darkX"/>
      <feOffset in="SourceAlpha" dx="1" dy="0" result="right"/>
      <feFlood flood-color="#fff" flood-opacity="0.3" result="l2"/>
      <feComposite in="l2" in2="right" operator="in" result="lightX"/>
      <feMerge>
        <feMergeNode in="dark"/>
        <feMergeNode in="darkX"/>
        <feMergeNode in="light"/>
        <feMergeNode in="lightX"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="568" height="768" rx="36" fill="#f8fafc" stroke="#28323c" stroke-width="8"/>
  <rect x="28" y="28" width="532" height="732" rx="28" stroke="#c8cdd2" stroke-width="3"/>

  <line x1="300" y1="450" x2="300" y2="150" stroke="#287846" stroke-width="9"/>
  <ellipse cx="240" cy="330" rx="80" ry="20" transform="rotate(50 240 330)" fill="#328c50"/>
  <ellipse cx="360" cy="350" rx="85" ry="20" transform="rotate(-50 360 350)" fill="#328c50"/>
  <g fill="#b464c8" stroke="#783296"><g transform="translate(300 140)"><ellipse rx="30" ry="12" transform="rotate(0)"/><ellipse rx="30" ry="12" transform="rotate(60)"/><ellipse rx="30" ry="12" transform="rotate(120)"/><circle r="10" fill="#fadc50" stroke="none"/></g>
  <g transform="translate(270 195)"><ellipse rx="30" ry="12"/><ellipse rx="30" ry="12" transform="rotate(60)"/><ellipse rx="30" ry="12" transform="rotate(120)"/><circle r="10" fill="#fadc50" stroke="none"/></g>
  <g transform="translate(330 205)"><ellipse rx="30" ry="12"/><ellipse rx="30" ry="12" transform="rotate(60)"/><ellipse rx="30" ry="12" transform="rotate(120)"/><circle r="10" fill="#fadc50" stroke="none"/></g></g>

  <text x="300" y="700" text-anchor="middle" font-family="Songti TC, Noto Serif TC, serif" font-weight="700" font-size="168" fill="#226e37" filter="url(#carve)">蘭</text>
</svg>
