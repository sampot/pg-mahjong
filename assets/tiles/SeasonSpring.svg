<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">

  <defs>
    <filter id="carve" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feOffset in="SourceAlpha" dx="0" dy="-1.5" result="up"/>
      <feFlood flood-color="#000" flood-opacity="0.4" result="darkFlood"/>
      <feComposite in="darkFlood" in2="up" operator="in" result="dark"/>
      <feOffset in="SourceAlpha" dx="0" dy="1.5" result="dn"/>
      <feFlood flood-color="#fff" flood-opacity="0.85" result="lightFlood"/>
      <feComposite in="lightFlood" in2="dn" operator="in" result="light"/>
      <feOffset in="SourceAlpha" dx="-1" dy="0" result="left"/>
      <feFlood flood-color="#000" flood-opacity="0.25" result="d2"/>
      <feComposite in="d2" in2="left" operator="in" result="darkX"/>
      <feOffset in="SourceAlpha" dx="1" dy="0" result="right"/>
      <feFlood flood-color="#fff" flood-opacity="0.3" result="l2"/>
      <feComposite in="l2" in2="right" operator="in" result="lightX"/>
      <feMerge>
        <feMergeNode in="dark"/>
        <feMergeNode in="darkX"/>
        <feMergeNode in="light"/>
        <feMergeNode in="lightX"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="10" y="10" width="568" height="768" rx="36" fill="#f8fafc" stroke="#28323c" stroke-width="8"/>
  <rect x="28" y="28" width="532" height="732" rx="28" stroke="#c8cdd2" stroke-width="3"/>

  <circle cx="420" cy="140" r="45" fill="#ffc850" stroke="#dca028" stroke-width="3"/>
  <path d="M100 430 Q300 330 500 430" stroke="#50a05a" stroke-width="9" fill="none"/>
  <g stroke="#328c46" stroke-width="7"><line x1="180" y1="420" x2="180" y2="330"/><line x1="260" y1="420" x2="260" y2="330"/><line x1="340" y1="420" x2="340" y2="330"/><line x1="420" y1="420" x2="420" y2="330"/></g>
  <g fill="#ff8caa"><circle cx="200" cy="250" r="12"/><circle cx="280" cy="220" r="12"/><circle cx="360" cy="245" r="12"/></g>

  <text x="300" y="700" text-anchor="middle" font-family="Songti TC, Noto Serif TC, serif" font-weight="700" font-size="168" fill="#a81c28" filter="url(#carve)">春</text>
</svg>
